<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interior Material Configurator</title>
  <style>
    :root {
      --bg-dark: #121212;
      --panel-bg: rgba(22, 22, 24, 0.88);
      --border-color: rgba(255, 255, 255, 0.12);
      --text-main: #f5f5f7;
      --text-sub: #a1a1a6;
      --accent: #2997ff;
      --danger: #ff453a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
    }

    /* Viewport Area */
    #stage-container {
      position: relative;
      flex: 1;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    canvas {
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      max-width: 100%;
      max-height: 100%;
      cursor: crosshair;
      object-fit: contain;
    }

    /* Banners & Diagnostics */
    .hint-banner {
      position: absolute;
      top: 20px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 13px;
      letter-spacing: 0.3px;
      color: var(--text-sub);
      pointer-events: none;
      z-index: 10;
      transition: opacity 0.3s ease;
    }
    .hint-banner span {
      color: var(--accent);
      font-weight: 600;
    }

    #error-log {
      display: none;
      position: absolute;
      top: 70px;
      max-width: 80%;
      background: rgba(40, 10, 10, 0.9);
      border: 1px solid var(--danger);
      color: #fff;
      padding: 16px 20px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
      z-index: 100;
      backdrop-filter: blur(10px);
    }
    #error-log h4 {
      color: var(--danger);
      margin-bottom: 6px;
      font-size: 14px;
    }

    /* Floating UI Controls */
    #sidebar {
      width: 320px;
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      border-left: 1px solid var(--border-color);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      z-index: 20;
    }

    h2 {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    .status-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
    }

    .status-card p {
      margin-bottom: 6px;
      color: var(--text-sub);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
      color: #fff;
    }

    .id-preview-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.4);
      display: inline-block;
    }

    .swatches-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 8px;
    }

    .swatch-btn {
      aspect-ratio: 1;
      border-radius: 8px;
      border: 2px solid transparent;
      cursor: pointer;
      position: relative;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .swatch-btn:hover {
      transform: scale(1.05);
    }

    .swatch-btn.active {
      border-color: #fff;
    }

    .actions {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease;
      text-align: center;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.18);
    }
  </style>
</head>
<body>

  <div id="stage-container">
    <div class="hint-banner" id="hintBanner">
      Loading render passes...
    </div>
    <div id="error-log">
      <h4>Image Load Diagnostic</h4>
      <div id="error-details"></div>
    </div>
    <canvas id="renderCanvas"></canvas>
  </div>

  <aside id="sidebar">
    <div>
      <h2>Material Configurator</h2>
    </div>

    <div class="status-card">
      <p>Active Surface</p>
      <div class="status-badge">
        <span id="idDot" class="id-preview-dot" style="background: transparent;"></span>
        <span id="targetName">None selected</span>
      </div>
    </div>

    <div>
      <h3 style="font-size: 12px; color: var(--text-sub); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;">Presets</h3>
      <div class="swatches-grid">
        <button class="swatch-btn" style="background: #2b2520;" data-color="rgba(43, 37, 32, 0.85)" title="Smoked Dark Walnut"></button>
        <button class="swatch-btn" style="background: #a48261;" data-color="rgba(164, 130, 97, 0.75)" title="Natural Oak"></button>
        <button class="swatch-btn" style="background: #ded7ce;" data-color="rgba(222, 215, 206, 0.85)" title="White Washed Nordic"></button>
        <button class="swatch-btn" style="background: #474b4e;" data-color="rgba(71, 75, 78, 0.85)" title="Anthracite Slate"></button>
        <button class="swatch-btn" style="background: #8b3a2b;" data-color="rgba(139, 58, 43, 0.8)" title="Terracotta Finish"></button>
        <button class="swatch-btn" style="background: #2e3a35;" data-color="rgba(46, 58, 53, 0.85)" title="Forest Olive"></button>
        <button class="swatch-btn" style="background: #eae9e5;" data-color="rgba(234, 233, 229, 0.85)" title="Warm Plaster / Calacatta"></button>
        <button class="swatch-btn" style="background: #1e1e20;" data-color="rgba(30, 30, 32, 0.9)" title="Matte Charcoal"></button>
      </div>
    </div>

    <div class="actions">
      <button class="btn" id="resetBtn">Reset All to Original</button>
    </div>
  </aside>

  <script>
    // Asset candidate lists to prevent 404 mismatch errors on GitHub Pages
    const ASSET_CANDIDATES = {
      beauty: [
        './Scene%2013_3.jpg',
        './Scene 13_3.jpg',
        './Scene%2013_3.jpeg',
        './Scene 13_3.png'
      ],
      ao: [
        './Scene%2013_3_AO.jpg',
        './Scene 13_3_AO.jpg',
        './Scene%2013_3_AO.jpeg',
        './Scene 13_3_AO.png'
      ],
      materialId: [
        './Scene%2013_3_MaterialID.jpg',
        './Scene 13_3_MaterialID.jpg',
        './Scene%2013_3_MaterialID.jpeg',
        './Scene 13_3_MaterialID.png'
      ],
      reflection: [
        './Scene%2013_3_Reflection.jpg',
        './Scene 13_3_Reflection.jpg',
        './Scene%2013_3_Reflection.jpeg',
        './Scene 13_3_Reflection.png'
      ]
    };

    const canvas = document.getElementById('renderCanvas');
    const ctx = canvas.getContext('2d');
    const hintBanner = document.getElementById('hintBanner');
    const errorLog = document.getElementById('error-log');
    const errorDetails = document.getElementById('error-details');

    const idCanvas = document.createElement('canvas');
    const idCtx = idCanvas.getContext('2d');

    const activeModifications = new Map();
    let currentSelectedRGB = null;
    const loadedImages = {};
    const COLOR_TOLERANCE = 18;

    // Helper: Attempts to load candidate URLs sequentially
    function loadAssetWithFallbacks(candidates) {
      return new Promise((resolve, reject) => {
        let index = 0;
        function tryNext() {
          if (index >= candidates.length) {
            reject(new Error(`Failed to load from options: ${candidates.join(', ')}`));
            return;
          }
          const img = new Image();
          img.crossOrigin = "anonymous";
          img.onload = () => resolve(img);
          img.onerror = () => {
            index++;
            tryNext();
          };
          img.src = candidates[index];
        }
        tryNext();
      });
    }

    async function init() {
      const keys = Object.keys(ASSET_CANDIDATES);
      const errors = [];

      for (const key of keys) {
        try {
          loadedImages[key] = await loadAssetWithFallbacks(ASSET_CANDIDATES[key]);
        } catch (err) {
          errors.push(err.message);
        }
      }

      if (errors.length > 0) {
        hintBanner.style.display = 'none';
        errorLog.style.display = 'block';
        errorDetails.innerHTML = errors.map(e => `<p style="margin-bottom:6px;">❌ ${e}</p>`).join('') +
          '<p style="margin-top:10px; color:#aaa;">Please ensure your files are in the repository root alongside index.html and check case-sensitivity.</p>';
        return;
      }

      const w = loadedImages.beauty.naturalWidth;
      const h = loadedImages.beauty.naturalHeight;

      canvas.width = w;
      canvas.height = h;
      idCanvas.width = w;
      idCanvas.height = h;

      // Draw ID map into offscreen buffer
      idCtx.drawImage(loadedImages.materialId, 0, 0, w, h);

      hintBanner.textContent = 'Click any surface (floor, wall, cabinets) to customize finish';
      render();
      setupEvents();
    }

    function render() {
      const w = canvas.width;
      const h = canvas.height;

      // Draw beauty base
      ctx.globalCompositeOperation = 'source-over';
      ctx.drawImage(loadedImages.beauty, 0, 0, w, h);

      if (activeModifications.size === 0) return;

      const idData = idCtx.getImageData(0, 0, w, h).data;

      // Working offscreen layer
      const workCanvas = document.createElement('canvas');
      workCanvas.width = w;
      workCanvas.height = h;
      const workCtx = workCanvas.getContext('2d');

      const maskImgData = workCtx.createImageData(w, h);
      const maskPixels = maskImgData.data;

      // Build colored mask from active selections
      for (const [rgbKey, color] of activeModifications.entries()) {
        const [tr, tg, tb] = rgbKey.split(',').map(Number);

        // Resolve hex/rgba to numeric RGB
        const temp = document.createElement('div');
        temp.style.color = color;
        document.body.appendChild(temp);
        const resolved = getComputedStyle(temp).color;
        document.body.removeChild(temp);
        const [cr, cg, cb] = resolved.match(/\d+/g).map(Number);

        for (let i = 0; i < idData.length; i += 4) {
          const r = idData[i];
          const g = idData[i + 1];
          const b = idData[i + 2];

          if (
            Math.abs(r - tr) <= COLOR_TOLERANCE &&
            Math.abs(g - tg) <= COLOR_TOLERANCE &&
            Math.abs(b - tb) <= COLOR_TOLERANCE
          ) {
            maskPixels[i] = cr;
            maskPixels[i + 1] = cg;
            maskPixels[i + 2] = cb;
            maskPixels[i + 3] = 255;
          }
        }
      }

      workCtx.putImageData(maskImgData, 0, 0);

      // Multiply Ambient Occlusion over modified regions
      workCtx.globalCompositeOperation = 'multiply';
      workCtx.drawImage(loadedImages.ao, 0, 0, w, h);

      // Mask precisely to keep unaffected areas clear
      workCtx.globalCompositeOperation = 'destination-in';
      workCtx.putImageData(maskImgData, 0, 0);

      // Add Reflection Pass highlights
      workCtx.globalCompositeOperation = 'screen';
      workCtx.drawImage(loadedImages.reflection, 0, 0, w, h);

      // Composite onto final canvas
      ctx.globalCompositeOperation = 'source-over';
      ctx.drawImage(workCanvas, 0, 0);
    }

    function setupEvents() {
      const targetName = document.getElementById('targetName');
      const idDot = document.getElementById('idDot');

      canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;

        const x = Math.floor((e.clientX - rect.left) * scaleX);
        const y = Math.floor((e.clientY - rect.top) * scaleY);

        const pixel = idCtx.getImageData(x, y, 1, 1).data;
        currentSelectedRGB = `${pixel[0]},${pixel[1]},${pixel[2]}`;

        idDot.style.background = `rgb(${currentSelectedRGB})`;
        targetName.textContent = `Zone (${pixel[0]}, ${pixel[1]}, ${pixel[2]})`;
      });

      document.querySelectorAll('.swatch-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          if (!currentSelectedRGB) {
            alert('Click a surface on the render first.');
            return;
          }

          document.querySelectorAll('.swatch-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');

          const color = btn.getAttribute('data-color');
          activeModifications.set(currentSelectedRGB, color);
          render();
        });
      });

      document.getElementById('resetBtn').addEventListener('click', () => {
        activeModifications.clear();
        currentSelectedRGB = null;
        idDot.style.background = 'transparent';
        targetName.textContent = 'None selected';
        document.querySelectorAll('.swatch-btn').forEach(b => b.classList.remove('active'));
        render();
      });
    }

    init();
  </script>
</body>
</html>
