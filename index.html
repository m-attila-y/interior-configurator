<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interior Material Configurator</title>
  <style>
    :root {
      --bg-dark: #101012;
      --panel-bg: rgba(20, 20, 23, 0.92);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f5f5f7;
      --text-sub: #8e8e93;
      --accent: #0a84ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
    }

    #stage-container {
      position: relative;
      flex: 1;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    canvas {
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
      max-width: 100%;
      max-height: 100%;
      cursor: crosshair;
      object-fit: contain;
    }

    .hint-banner {
      position: absolute;
      top: 20px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 13px;
      color: var(--text-sub);
      pointer-events: none;
      z-index: 10;
    }

    #sidebar {
      width: 340px;
      background: var(--panel-bg);
      backdrop-filter: blur(24px);
      border-left: 1px solid var(--border);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      z-index: 20;
    }

    h2 {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .status-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 500;
      margin-top: 4px;
    }

    .zone-indicator {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.3);
      display: inline-block;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      max-height: 60vh;
      padding-right: 4px;
    }

    .material-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .material-card:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .material-card.active {
      border-color: var(--accent);
      background: rgba(10, 132, 255, 0.15);
    }

    .thumb-preview {
      width: 44px;
      height: 44px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background-size: cover;
      background-position: center;
      flex-shrink: 0;
    }

    .mat-info h4 {
      font-size: 13px;
      font-weight: 500;
    }
    .mat-info p {
      font-size: 11px;
      color: var(--text-sub);
      margin-top: 2px;
    }

    .actions {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease;
      text-align: center;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>

  <div id="stage-container">
    <div class="hint-banner" id="hintBanner">Loading render assets...</div>
    <canvas id="renderCanvas"></canvas>
  </div>

  <aside id="sidebar">
    <div>
      <h2>Material Configurator</h2>
    </div>

    <div class="status-card">
      <span style="font-size: 11px; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.5px;">Selected Surface</span>
      <div class="status-badge">
        <span id="idDot" class="zone-indicator" style="background: transparent;"></span>
        <span id="targetName">Click any surface to customize</span>
      </div>
    </div>

    <div>
      <h3 style="font-size: 11px; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px;">Available Finishes</h3>
      <div class="options-container" id="materialOptions">
        <p style="font-size: 13px; color: var(--text-sub); padding: 10px 0;">Select a wall, floor, or cabinet surface to see its tailored materials.</p>
      </div>
    </div>

    <div class="actions">
      <button class="btn" id="resetAllBtn">Reset All Surfaces</button>
    </div>
  </aside>

  <script>
    const ASSET_CANDIDATES = {
      beauty: ['Scene%2013_3.png', 'Scene 13_3.png', 'Scene%2013_3.jpg', 'Scene 13_3.jpg'],
      ao: ['Scene%2013_3_AO.png', 'Scene 13_3_AO.png', 'Scene%2013_3_AO.jpg', 'Scene 13_3_AO.jpg'],
      materialId: ['Scene%2013_3_MaterialID.png', 'Scene 13_3_MaterialID.png', 'Scene%2013_3_MaterialID.jpg', 'Scene 13_3_MaterialID.jpg'],
      reflection: ['Scene%2013_3_Reflection.png', 'Scene 13_3_Reflection.png', 'Scene%2013_3_Reflection.jpg', 'Scene 13_3_Reflection.jpg']
    };

    const canvas = document.getElementById('renderCanvas');
    const ctx = canvas.getContext('2d');
    const hintBanner = document.getElementById('hintBanner');
    const materialOptions = document.getElementById('materialOptions');
    const targetName = document.getElementById('targetName');
    const idDot = document.getElementById('idDot');

    let imgW, imgH;
    let beautyPixels, aoPixels, idPixels, refPixels;
    const loadedImages = {};

    const activeModifications = new Map();
    let activeZone = null;
    const COLOR_TOLERANCE = 22;

    // Procedural Seamless High-Res Pattern Generators
    function createWoodTexture(baseR, baseG, baseB, darkR, darkG, darkB, plankWidth = 32) {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 512;
      const cx = c.getContext('2d');
      const imgData = cx.createImageData(512, 512);
      const d = imgData.data;

      for (let y = 0; y < 512; y++) {
        for (let x = 0; x < 512; x++) {
          const idx = (y * 512 + x) * 4;
          const grain = (Math.sin(x * 0.12 + Math.sin(y * 0.04) * 4) + 1) * 0.5;
          const noise = (Math.random() - 0.5) * 16;
          const isSeam = (x % plankWidth === 0);

          if (isSeam) {
            d[idx] = Math.max(0, baseR - 45);
            d[idx + 1] = Math.max(0, baseG - 45);
            d[idx + 2] = Math.max(0, baseB - 45);
          } else {
            d[idx] = Math.min(255, Math.max(0, (baseR * grain + darkR * (1 - grain)) + noise));
            d[idx + 1] = Math.min(255, Math.max(0, (baseG * grain + darkG * (1 - grain)) + noise));
            d[idx + 2] = Math.min(255, Math.max(0, (baseB * grain + darkB * (1 - grain)) + noise));
          }
          d[idx + 3] = 255;
        }
      }
      cx.putImageData(imgData, 0, 0);
      return c;
    }

    function createStoneTexture(baseR, baseG, baseB, veinR, veinG, veinB) {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 512;
      const cx = c.getContext('2d');
      const imgData = cx.createImageData(512, 512);
      const d = imgData.data;

      for (let y = 0; y < 512; y++) {
        for (let x = 0; x < 512; x++) {
          const idx = (y * 512 + x) * 4;
          const vein = Math.sin(x * 0.025 + y * 0.025 + Math.sin(x * 0.06) * 2.5);
          const isVein = Math.abs(vein) < 0.06;
          const noise = (Math.random() - 0.5) * 8;

          if (isVein) {
            d[idx] = Math.min(255, Math.max(0, veinR + noise));
            d[idx + 1] = Math.min(255, Math.max(0, veinG + noise));
            d[idx + 2] = Math.min(255, Math.max(0, veinB + noise));
          } else {
            d[idx] = Math.min(255, Math.max(0, baseR + noise));
            d[idx + 1] = Math.min(255, Math.max(0, baseG + noise));
            d[idx + 2] = Math.min(255, Math.max(0, baseB + noise));
          }
          d[idx + 3] = 255;
        }
      }
      cx.putImageData(imgData, 0, 0);
      return c;
    }

    function createPlasterTexture(r, g, b) {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 512;
      const cx = c.getContext('2d');
      const imgData = cx.createImageData(512, 512);
      const d = imgData.data;

      for (let i = 0; i < d.length; i += 4) {
        const noise = (Math.random() - 0.5) * 10;
        d[i] = Math.min(255, Math.max(0, r + noise));
        d[i + 1] = Math.min(255, Math.max(0, g + noise));
        d[i + 2] = Math.min(255, Math.max(0, b + noise));
        d[i + 3] = 255;
      }
      cx.putImageData(imgData, 0, 0);
      return c;
    }

    const MATERIAL_CATALOG = {
      floor: {
        title: 'Flooring Surface',
        matcher: (r, g, b) => (r > 130 && r < 180 && g < 130 && b > 180),
        isFloorPlane: true,
        items: [
          { id: 'orig', name: 'Original Oak Planks', sub: 'Baseline Architectural Finish', isOriginal: true },
          { id: 'fl_walnut', name: 'Smoked American Walnut', sub: 'Deep Espresso Tone', textureCanvas: createWoodTexture(75, 52, 38, 48, 32, 22, 36) },
          { id: 'fl_nordic', name: 'Nordic White Bleached Oak', sub: 'Light Scandinavian Tone', textureCanvas: createWoodTexture(220, 212, 198, 195, 185, 170, 36) },
          { id: 'fl_marble', name: 'Calacatta Honed Marble', sub: 'Large Format 120x120', textureCanvas: createStoneTexture(232, 230, 226, 150, 150, 155) },
          { id: 'fl_slate',  name: 'Anthracite Flamed Slate', sub: 'Natural Dark Cleft Stone', textureCanvas: createStoneTexture(65, 68, 72, 42, 45, 48) }
        ]
      },
      wall: {
        title: 'Wall Surface',
        matcher: (r, g, b) => (g > 120 && r < 90 && b < 90),
        items: [
          { id: 'orig', name: 'Original Warm Neutral', sub: 'Baseline Architectural Finish', isOriginal: true },
          { id: 'wl_lime',   name: 'Roman Travertine Plaster', sub: 'Textured Lime Wash', textureCanvas: createPlasterTexture(230, 225, 212) },
          { id: 'wl_sage',   name: 'Nordic Sage Micro-Cement', sub: 'Smooth Mineral Finish', textureCanvas: createPlasterTexture(135, 150, 140) },
          { id: 'wl_graph',  name: 'Charcoal Slag Plaster', sub: 'Dark Contemporary Accent', textureCanvas: createPlasterTexture(60, 62, 65) },
          { id: 'wl_terrac', name: 'Terracotta Siena Clay', sub: 'Natural Earthen Pigment', textureCanvas: createPlasterTexture(165, 90, 72) }
        ]
      },
      cabinet: {
        title: 'Kitchen & Millwork',
        matcher: (r, g, b) => (r > 150 && g > 90 && b < 60) || (b > 160 && r < 80),
        items: [
          { id: 'orig', name: 'Original Natural Finish', sub: 'Baseline Architectural Finish', isOriginal: true },
          { id: 'cb_black',  name: 'Matte Obsidian Fenix', sub: 'Anti-Fingerprint Nano Finish', textureCanvas: createPlasterTexture(40, 42, 44) },
          { id: 'cb_eak',    name: 'Rift Cut Warm Oak', sub: 'Vertical Grain Veneer', textureCanvas: createWoodTexture(180, 150, 115, 140, 110, 82, 28) },
          { id: 'cb_cream',  name: 'Warm Cashmere Lacquer', sub: 'Satin Polyurethane', textureCanvas: createPlasterTexture(222, 218, 208) }
        ]
      }
    };

    function loadAsset(candidates) {
      return new Promise((resolve, reject) => {
        let i = 0;
        function next() {
          if (i >= candidates.length) return reject(new Error('Asset not found'));
          const img = new Image();
          img.crossOrigin = 'anonymous';
          img.onload = () => resolve(img);
          img.onerror = () => { i++; next(); };
          img.src = candidates[i];
        }
        next();
      });
    }

    function extractPixels(img) {
      const c = document.createElement('canvas');
      c.width = img.naturalWidth;
      c.height = img.naturalHeight;
      const cx = c.getContext('2d');
      cx.drawImage(img, 0, 0);
      return cx.getImageData(0, 0, c.width, c.height).data;
    }

    async function init() {
      try {
        for (const [key, paths] of Object.entries(ASSET_CANDIDATES)) {
          loadedImages[key] = await loadAsset(paths);
        }
      } catch (err) {
        hintBanner.textContent = 'Error loading render assets. Check file names.';
        hintBanner.style.color = '#ff453a';
        return;
      }

      imgW = loadedImages.beauty.naturalWidth;
      imgH = loadedImages.beauty.naturalHeight;

      canvas.width = imgW;
      canvas.height = imgH;

      beautyPixels = extractPixels(loadedImages.beauty);
      aoPixels = extractPixels(loadedImages.ao);
      idPixels = extractPixels(loadedImages.materialId);
      refPixels = extractPixels(loadedImages.reflection);

      for (const cat of Object.values(MATERIAL_CATALOG)) {
        for (const item of cat.items) {
          if (item.textureCanvas) {
            item.texCtx = item.textureCanvas.getContext('2d');
            item.texData = item.texCtx.getImageData(0, 0, 512, 512).data;
          }
        }
      }

      hintBanner.textContent = 'Click any surface (floor, wall, cabinetry) to customize finish';
      render();
      setupEvents();
    }

    function render() {
      const outImageData = ctx.createImageData(imgW, imgH);
      const out = outImageData.data;

      // 1. Copy baseline beauty pass
      out.set(beautyPixels);

      if (activeModifications.size === 0) {
        ctx.putImageData(outImageData, 0, 0);
        return;
      }

      // Camera Horizon / Vanishing Line for Floor Perspective Mapping
      // In this scene, eye level horizon sits at roughly 45% height (stairs bottom)
      const horizonY = imgH * 0.44;
      const vanishingX = imgW * 0.48;

      for (const [rgbKey, matItem] of activeModifications.entries()) {
        if (matItem.isOriginal || !matItem.texData) continue;

        const [tr, tg, tb] = rgbKey.split(',').map(Number);
        const texData = matItem.texData;
        const isFloor = matItem.isFloorPlane;

        for (let y = 0; y < imgH; y++) {
          // Perspective scale factor for ground plane (Z-depth foreshortening)
          const dy = y - horizonY;
          const zDepth = dy > 1 ? (imgH / dy) : 999;

          for (let x = 0; x < imgW; x++) {
            const i = (y * imgW + x) * 4;
            const mr = idPixels[i];
            const mg = idPixels[i + 1];
            const mb = idPixels[i + 2];

            if (
              Math.abs(mr - tr) <= COLOR_TOLERANCE &&
              Math.abs(mg - tg) <= COLOR_TOLERANCE &&
              Math.abs(mb - tb) <= COLOR_TOLERANCE
            ) {
              let u, v;

              if (isFloor && dy > 0) {
                // Perspective-correct floor UV projection
                const normX = (x - vanishingX) / imgW;
                const worldX = normX * zDepth * 400;
                const worldY = zDepth * 350;

                u = Math.floor(Math.abs(worldX)) % 512;
                v = Math.floor(Math.abs(worldY)) % 512;
              } else {
                // Planar mapping for vertical surfaces (walls, cabinets)
                u = Math.floor(x * 0.8) % 512;
                v = Math.floor(y * 0.8) % 512;
              }

              const texIdx = (v * 512 + u) * 4;
              const albedoR = texData[texIdx];
              const albedoG = texData[texIdx + 1];
              const albedoB = texData[texIdx + 2];

              // LIGHT PRESERVATION (Delighting & Realistic Relighting):
              // Extract original incident lighting luminance from beauty pass
              const origR = beautyPixels[i];
              const origG = beautyPixels[i + 1];
              const origB = beautyPixels[i + 2];
              const origLuma = (0.299 * origR + 0.587 * origG + 0.114 * origB) / 255.0;

              // Incorporate AO for contact crevice depth
              const ao = aoPixels[i] / 255.0;
              const lightModulator = Math.pow(origLuma, 0.85) * (0.4 + 0.6 * ao) * 1.35;

              // Shaded albedo with full incident scene bounce lighting
              const shadedR = albedoR * lightModulator;
              const shadedG = albedoG * lightModulator;
              const shadedB = albedoB * lightModulator;

              // FRESNEL ADDITIVE REFLECTION
              // Reflection map contains only highlight sheen; add softly without crushing diffuse base
              const refR = refPixels[i] * 0.75;
              const refG = refPixels[i + 1] * 0.75;
              const refB = refPixels[i + 2] * 0.75;

              // Additive highlight blend with highlight preservation
              out[i]     = Math.min(255, shadedR + refR);
              out[i + 1] = Math.min(255, shadedG + refG);
              out[i + 2] = Math.min(255, shadedB + refB);
              out[i + 3] = 255;
            }
          }
        }
      }

      ctx.putImageData(outImageData, 0, 0);
    }

    function identifyCategory(r, g, b) {
      for (const [key, cat] of Object.entries(MATERIAL_CATALOG)) {
        if (cat.matcher(r, g, b)) return { key, config: cat };
      }
      return {
        key: 'generic',
        config: {
          title: 'Selected Surface',
          items: [
            { id: 'orig', name: 'Original Finish', sub: 'Baseline Architectural Render', isOriginal: true },
            { id: 'gen_oak', name: 'Natural Oak', sub: 'Fine Grain Finish', textureCanvas: createWoodTexture(180, 145, 110, 140, 110, 80) },
            { id: 'gen_dark', name: 'Dark Slate', sub: 'Mineral Finish', textureCanvas: createPlasterTexture(50, 52, 55) }
          ]
        }
      };
    }

    function populateSidebar(catInfo, rgbKey) {
      materialOptions.innerHTML = '';
      targetName.textContent = catInfo.config.title;

      const currentSelection = activeModifications.get(rgbKey);
      const activeId = currentSelection ? currentSelection.id : 'orig';

      catInfo.config.items.forEach((item) => {
        const card = document.createElement('div');
        card.className = `material-card ${item.id === activeId ? 'active' : ''}`;

        const preview = document.createElement('div');
        preview.className = 'thumb-preview';
        if (item.isOriginal) {
          preview.style.background = '#28282a';
          preview.style.backgroundImage = 'radial-gradient(circle, #555 10%, transparent 10%)';
          preview.style.backgroundSize = '8px 8px';
        } else if (item.textureCanvas) {
          preview.style.backgroundImage = `url(${item.textureCanvas.toDataURL()})`;
        }

        const info = document.createElement('div');
        info.className = 'mat-info';
        info.innerHTML = `<h4>${item.name}</h4><p>${item.sub}</p>`;

        card.appendChild(preview);
        card.appendChild(info);

        card.addEventListener('click', () => {
          document.querySelectorAll('.material-card').forEach(c => c.classList.remove('active'));
          card.classList.add('active');

          if (item.isOriginal) {
            activeModifications.delete(rgbKey);
          } else {
            // Tag with floor plane property for perspective projection
            item.isFloorPlane = catInfo.config.isFloorPlane || false;
            activeModifications.set(rgbKey, item);
          }
          render();
        });

        materialOptions.appendChild(card);
      });
    }

    function setupEvents() {
      canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;

        const x = Math.floor((e.clientX - rect.left) * scaleX);
        const y = Math.floor((e.clientY - rect.top) * scaleY);

        const idx = (y * imgW + x) * 4;
        const r = idPixels[idx];
        const g = idPixels[idx + 1];
        const b = idPixels[idx + 2];

        const rgbKey = `${r},${g},${b}`;
        idDot.style.background = `rgb(${rgbKey})`;

        const category = identifyCategory(r, g, b);
        activeZone = { rgbKey, category };

        populateSidebar(category, rgbKey);
      });

      document.getElementById('resetAllBtn').addEventListener('click', () => {
        activeModifications.clear();
        if (activeZone) {
          populateSidebar(activeZone.category, activeZone.rgbKey);
        }
        render();
      });
    }

    init();
  </script>
</body>
</html>
