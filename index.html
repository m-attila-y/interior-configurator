<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interior Material Configurator</title>
  <style>
    :root {
      --bg-dark: #121212;
      --panel-bg: rgba(22, 22, 24, 0.88);
      --border-color: rgba(255, 255, 255, 0.12);
      --text-main: #f5f5f7;
      --text-sub: #a1a1a6;
      --accent: #2997ff;
      --danger: #ff453a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
    }

    #stage-container {
      position: relative;
      flex: 1;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    canvas {
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      max-width: 100%;
      max-height: 100%;
      cursor: crosshair;
      object-fit: contain;
    }

    .hint-banner {
      position: absolute;
      top: 20px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 13px;
      letter-spacing: 0.3px;
      color: var(--text-sub);
      pointer-events: none;
      z-index: 10;
    }

    #error-log {
      display: none;
      position: absolute;
      top: 70px;
      max-width: 80%;
      background: rgba(40, 10, 10, 0.9);
      border: 1px solid var(--danger);
      color: #fff;
      padding: 16px 20px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
      z-index: 100;
      backdrop-filter: blur(10px);
    }
    #error-log h4 {
      color: var(--danger);
      margin-bottom: 6px;
      font-size: 14px;
    }

    #sidebar {
      width: 320px;
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      border-left: 1px solid var(--border-color);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      z-index: 20;
    }

    h2 {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    .status-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
    }

    .status-card p {
      margin-bottom: 6px;
      color: var(--text-sub);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
      color: #fff;
    }

    .id-preview-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.4);
      display: inline-block;
    }

    .swatches-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 8px;
    }

    .swatch-btn {
      aspect-ratio: 1;
      border-radius: 8px;
      border: 2px solid transparent;
      cursor: pointer;
      position: relative;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .swatch-btn:hover {
      transform: scale(1.05);
    }

    .swatch-btn.active {
      border-color: #fff;
    }

    .actions {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease;
      text-align: center;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.18);
    }
  </style>
</head>
<body>

  <div id="stage-container">
    <div class="hint-banner" id="hintBanner">Loading render passes...</div>
    <div id="error-log">
      <h4>Image Load Diagnostic</h4>
      <div id="error-details"></div>
    </div>
    <canvas id="renderCanvas"></canvas>
  </div>

  <aside id="sidebar">
    <div>
      <h2>Material Configurator</h2>
    </div>

    <div class="status-card">
      <p>Active Surface</p>
      <div class="status-badge">
        <span id="idDot" class="id-preview-dot" style="background: transparent;"></span>
        <span id="targetName">None selected</span>
      </div>
    </div>

    <div>
      <h3 style="font-size: 12px; color: var(--text-sub); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;">Presets</h3>
      <div class="swatches-grid">
        <button class="swatch-btn" style="background: #2b2520;" data-r="43" data-g="37" data-b="32" title="Smoked Dark Walnut"></button>
        <button class="swatch-btn" style="background: #a48261;" data-r="164" data-g="130" data-b="97" title="Natural Oak"></button>
        <button class="swatch-btn" style="background: #ded7ce;" data-r="222" data-g="215" data-b="206" title="White Washed Nordic"></button>
        <button class="swatch-btn" style="background: #474b4e;" data-r="71" data-g="75" data-b="78" title="Anthracite Slate"></button>
        <button class="swatch-btn" style="background: #8b3a2b;" data-r="139" data-g="58" data-b="43" title="Terracotta Finish"></button>
        <button class="swatch-btn" style="background: #2e3a35;" data-r="46" data-g="58" data-b="53" title="Forest Olive"></button>
        <button class="swatch-btn" style="background: #eae9e5;" data-r="234" data-g="233" data-b="229" title="Warm Plaster / Calacatta"></button>
        <button class="swatch-btn" style="background: #1e1e20;" data-r="30" data-g="30" data-b="32" title="Matte Charcoal"></button>
      </div>
    </div>

    <div class="actions">
      <button class="btn" id="resetBtn">Reset All to Original</button>
    </div>
  </aside>

  <script>
    const ASSET_CANDIDATES = {
      beauty: ['Scene%2013_3.png', 'Scene 13_3.png', 'Scene%2013_3.jpg', 'Scene 13_3.jpg'],
      ao: ['Scene%2013_3_AO.png', 'Scene 13_3_AO.png', 'Scene%2013_3_AO.jpg', 'Scene 13_3_AO.jpg'],
      materialId: ['Scene%2013_3_MaterialID.png', 'Scene 13_3_MaterialID.png', 'Scene%2013_3_MaterialID.jpg', 'Scene 13_3_MaterialID.jpg'],
      reflection: ['Scene%2013_3_Reflection.png', 'Scene 13_3_Reflection.png', 'Scene%2013_3_Reflection.jpg', 'Scene 13_3_Reflection.jpg']
    };

    const canvas = document.getElementById('renderCanvas');
    const ctx = canvas.getContext('2d');
    const hintBanner = document.getElementById('hintBanner');
    const errorLog = document.getElementById('error-log');
    const errorDetails = document.getElementById('error-details');

    const activeModifications = new Map(); // Key: "r,g,b", Value: {r, g, b}
    let currentSelectedRGB = null;
    const loadedImages = {};
    const COLOR_TOLERANCE = 18;

    // Pixel buffers
    let beautyPixels, aoPixels, idPixels, refPixels;
    let imgW, imgH;

    function getBuffer(img) {
      const c = document.createElement('canvas');
      c.width = img.naturalWidth;
      c.height = img.naturalHeight;
      const cx = c.getContext('2d');
      cx.drawImage(img, 0, 0);
      return cx.getImageData(0, 0, c.width, c.height).data;
    }

    function loadAssetWithFallbacks(candidates) {
      return new Promise((resolve, reject) => {
        let index = 0;
        function tryNext() {
          if (index >= candidates.length) {
            reject(new Error(`Failed to load asset: checked ${candidates.join(', ')}`));
            return;
          }
          const img = new Image();
          img.crossOrigin = "anonymous";
          img.onload = () => resolve(img);
          img.onerror = () => {
            index++;
            tryNext();
          };
          img.src = candidates[index];
        }
        tryNext();
      });
    }

    async function init() {
      const keys = Object.keys(ASSET_CANDIDATES);
      const errors = [];

      for (const key of keys) {
        try {
          loadedImages[key] = await loadAssetWithFallbacks(ASSET_CANDIDATES[key]);
        } catch (err) {
          errors.push(err.message);
        }
      }

      if (errors.length > 0) {
        hintBanner.style.display = 'none';
        errorLog.style.display = 'block';
        errorDetails.innerHTML = errors.map(e => `<p style="margin-bottom:6px;">❌ ${e}</p>`).join('');
        return;
      }

      imgW = loadedImages.beauty.naturalWidth;
      imgH = loadedImages.beauty.naturalHeight;

      canvas.width = imgW;
      canvas.height = imgH;

      // Extract pixel data once for optimal performance
      beautyPixels = getBuffer(loadedImages.beauty);
      aoPixels = getBuffer(loadedImages.ao);
      idPixels = getBuffer(loadedImages.materialId);
      refPixels = getBuffer(loadedImages.reflection);

      hintBanner.textContent = 'Click any surface (floor, wall, cabinets) to customize finish';
      render();
      setupEvents();
    }

    function render() {
      // Create output image data buffer
      const outImageData = ctx.createImageData(imgW, imgH);
      const out = outImageData.data;

      // 1. Copy original beauty pass completely
      out.set(beautyPixels);

      // 2. If there are modifications, update ONLY matching pixels
      if (activeModifications.size > 0) {
        for (const [rgbKey, color] of activeModifications.entries()) {
          const [tr, tg, tb] = rgbKey.split(',').map(Number);
          const cr = color.r;
          const cg = color.g;
          const cb = color.b;

          for (let i = 0; i < idPixels.length; i += 4) {
            const mr = idPixels[i];
            const mg = idPixels[i + 1];
            const mb = idPixels[i + 2];

            // Match Material ID zone
            if (
              Math.abs(mr - tr) <= COLOR_TOLERANCE &&
              Math.abs(mg - tg) <= COLOR_TOLERANCE &&
              Math.abs(mb - tb) <= COLOR_TOLERANCE
            ) {
              // AO factor normalized (0.0 - 1.0)
              const ao = aoPixels[i] / 255.0;

              // Base tint shaded by Ambient Occlusion (Multiply)
              const shadedR = cr * ao;
              const shadedG = cg * ao;
              const shadedB = cb * ao;

              // Reflection Pass (Screen / Additive composite)
              const refR = refPixels[i];
              const refG = refPixels[i + 1];
              const refB = refPixels[i + 2];

              // Screen blend formula: 255 - (255 - base) * (255 - refl) / 255
              out[i]     = 255 - ((255 - shadedR) * (255 - refR)) / 255;
              out[i + 1] = 255 - ((255 - shadedG) * (255 - refG)) / 255;
              out[i + 2] = 255 - ((255 - shadedB) * (255 - refB)) / 255;
              out[i + 3] = 255;
            }
          }
        }
      }

      ctx.putImageData(outImageData, 0, 0);
    }

    function setupEvents() {
      const targetName = document.getElementById('targetName');
      const idDot = document.getElementById('idDot');

      canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;

        const x = Math.floor((e.clientX - rect.left) * scaleX);
        const y = Math.floor((e.clientY - rect.top) * scaleY);

        const index = (y * imgW + x) * 4;
        const r = idPixels[index];
        const g = idPixels[index + 1];
        const b = idPixels[index + 2];

        currentSelectedRGB = `${r},${g},${b}`;
        idDot.style.background = `rgb(${currentSelectedRGB})`;
        targetName.textContent = `Zone (${r}, ${g}, ${b})`;
      });

      document.querySelectorAll('.swatch-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          if (!currentSelectedRGB) {
            alert('Click a surface on the render first.');
            return;
          }

          document.querySelectorAll('.swatch-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');

          const r = Number(btn.getAttribute('data-r'));
          const g = Number(btn.getAttribute('data-g'));
          const b = Number(btn.getAttribute('data-b'));

          activeModifications.set(currentSelectedRGB, { r, g, b });
          render();
        });
      });

      document.getElementById('resetBtn').addEventListener('click', () => {
        activeModifications.clear();
        currentSelectedRGB = null;
        idDot.style.background = 'transparent';
        targetName.textContent = 'None selected';
        document.querySelectorAll('.swatch-btn').forEach(b => b.classList.remove('active'));
        render();
      });
    }

    init();
  </script>
</body>
</html>
